<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Inquiry | Your Name - Web Developer Portfolio</title>
<!-- PAGE 3: FORM - styled with EXTERNAL CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Project Inquiry</h1>
  <p class="tagline">Tell me about your website. Use dummy details when testing.</p>
</header>
<nav>
  <a href="index.html">Home</a>
  <a href="information.html">Projects &amp; Services</a>
  <a href="registration.html">Project Inquiry</a>
</nav>

<main>
  <form id="registration-form" action="#" method="post">

    <!-- Account details -->
    <fieldset>
      <legend>Create your account</legend>
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="e.g. Ali Khan" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>

      <label for="password">Password (minimum 8 characters)</label>
      <input type="password" id="password" name="password" minlength="8" required>

      <label for="age">Age (16 to 80)</label>
      <input type="number" id="age" name="age" min="16" max="80">
    </fieldset>

    <!-- Project details -->
    <fieldset>
      <legend>Project details</legend>
      <label for="date">Preferred Start Date</label>
      <input type="date" id="date" name="start_date">

      <p class="group-title">Project type</p>
      <div class="choice"><input type="radio" id="type-new" name="project_type" value="new" checked><label for="type-new">New website</label></div>
      <div class="choice"><input type="radio" id="type-redesign" name="project_type" value="redesign"><label for="type-redesign">Redesign existing site</label></div>

      <p class="group-title">Services needed</p>
      <div class="choice"><input type="checkbox" id="svc-design" name="services" value="design"><label for="svc-design">Page design</label></div>
      <div class="choice"><input type="checkbox" id="svc-forms" name="services" value="forms"><label for="svc-forms">Forms and tables</label></div>
      <div class="choice"><input type="checkbox" id="svc-hosting" name="services" value="hosting"><label for="svc-hosting">GitHub Pages hosting</label></div>

      <label for="budget">Budget</label>
      <select id="budget" name="budget" required>
        <option value="" disabled selected>Select your budget</option>
        <option value="under-10k">Under PKR 10,000</option>
        <option value="10k-25k">PKR 10,000 to 25,000</option>
        <option value="over-25k">Over PKR 25,000</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Additional information</legend>
      <label for="comments">Describe your project (max 300 characters)</label>
      <textarea id="comments" name="comments" rows="5" maxlength="300"></textarea>
    </fieldset>

    <button type="submit">Send inquiry</button>
    <button type="reset" class="secondary">Reset form</button>
  </form>
</main>

<footer>
  <p>&copy; 2026 Your Name | <a href="mailto:yourname@example.com">yourname@example.com</a></p>
</footer>
</body>
</html>
